<!DOCTYPE html>
<html>

<head>

<title>Homework</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>📚 Homework Manager</h2>

<hr>

<a href="/add_homework" class="btn btn-primary">

+ Add Homework

</a>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Subject</th>

<th>Homework</th>

<th>Due Date</th>

<th>Priority</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for hw in homework_list %}

<tr>

    <td>{{ hw.id }}</td>

    <td>{{ hw.subject }}</td>

    <td>{{ hw.title }}</td>

    <td>{{ hw.due_date }}</td>

    <td>{{ hw.priority }}</td>

    <td>{{ hw.status }}</td>

    <td>

        <a href="/edit_homework/{{ hw.id }}" class="btn btn-warning btn-sm">
    Edit
</a>

        <a href="/delete_homework/{{ hw.id }}"
   class="btn btn-danger btn-sm"
   onclick="return confirm('Are you sure you want to delete this homework?')">
    Delete
</a>

    </td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
