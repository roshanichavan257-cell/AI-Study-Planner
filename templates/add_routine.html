<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Routine</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow p-4">

<h2>⏰ Add Daily Routine</h2>

<form method="POST">

<div class="mb-3">

<label>Activity</label>

<input
type="text"
name="activity"
class="form-control"
placeholder="College / Gym / Study / Sleep"
required>

</div>

<div class="mb-3">

<label>Start Time</label>

<input
type="time"
name="start_time"
class="form-control"
required>

</div>

<div class="mb-3">

<label>End Time</label>

<input
type="time"
name="end_time"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Day</label>

<select
name="day"
class="form-select">

<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
<option>Saturday</option>
<option>Sunday</option>
<option>Daily</option>

</select>

</div>

<button class="btn btn-success">
Save Routine
</button>

<a href="/routine" class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</div>

</div>

</div>

</body>
</html>
