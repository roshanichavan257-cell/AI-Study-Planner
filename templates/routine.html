<!DOCTYPE html>
<html>

<head>

<title>Daily Routine</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>⏰ Daily Routine</h2>

<hr>

<a href="/add_routine" class="btn btn-primary mb-3">

+ Add Routine

</a>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Activity</th>
<th>Start Time</th>
<th>End Time</th>
<th>Day</th>
<th>Action</th>

</tr>

</thead>

<tbody>

{% for r in routine_list %}

<tr>

<td>{{ r.id }}</td>

<td>{{ r.activity }}</td>

<td>{{ r.start_time }}</td>

<td>{{ r.end_time }}</td>

<td>{{ r.day }}</td>

<td>

<a href="/edit_routine/{{ r.id }}" class="btn btn-warning btn-sm">
    Edit
</a>

<a href="/delete_routine/{{ r.id }}"
   class="btn btn-danger btn-sm"
   onclick="return confirm('Delete this routine?')">
    Delete
</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
