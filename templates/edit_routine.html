<!DOCTYPE html>
<html>
<head>
    <title>Edit Routine</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h2>Edit Routine</h2>

<form method="POST">

<label>Activity</label>

<input
type="text"
name="activity"
class="form-control"
value="{{ routine.activity }}"
required>

<label class="mt-3">Start Time</label>

<input
type="time"
name="start_time"
class="form-control"
value="{{ routine.start_time }}"
required>

<label class="mt-3">End Time</label>

<input
type="time"
name="end_time"
class="form-control"
value="{{ routine.end_time }}"
required>

<label class="mt-3">Day</label>

<select name="day" class="form-select">

<option {% if routine.day=="Monday" %}selected{% endif %}>Monday</option>
<option {% if routine.day=="Tuesday" %}selected{% endif %}>Tuesday</option>
<option {% if routine.day=="Wednesday" %}selected{% endif %}>Wednesday</option>
<option {% if routine.day=="Thursday" %}selected{% endif %}>Thursday</option>
<option {% if routine.day=="Friday" %}selected{% endif %}>Friday</option>
<option {% if routine.day=="Saturday" %}selected{% endif %}>Saturday</option>
<option {% if routine.day=="Sunday" %}selected{% endif %}>Sunday</option>
<option {% if routine.day=="Daily" %}selected{% endif %}>Daily</option>

</select>

<br>

<button class="btn btn-success">

Update Routine

</button>

<a href="/routine" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</body>
</html>
