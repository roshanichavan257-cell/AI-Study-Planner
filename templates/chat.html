<!DOCTYPE html>
<html>

<head>

    <title>AI Study Assistant</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .chat-card {
            max-width: 850px;
            margin: 50px auto;
            border-radius: 20px;
        }

        .answer-box {
            background: white;
            border-radius: 15px;
            padding: 25px;
            line-height: 1.7;
        }

        .answer-box h1,
        .answer-box h2,
        .answer-box h3,
        .answer-box h4 {
            margin-top: 20px;
        }

        .answer-box pre {
            background: #212529;
            color: white;
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
        }

        .answer-box code {
            padding: 2px 5px;
            border-radius: 4px;
        }

        .question-box {
            border-radius: 12px;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card shadow chat-card p-4">

        <h2 class="text-center mb-2">
            🤖 AI Study Assistant
        </h2>

        <p class="text-center text-muted">
            Ask me anything about your studies
        </p>

        <hr>


        <!-- QUESTION FORM -->

        <form method="POST">

            <label class="form-label">
                💬 Your Question
            </label>

            <input
                type="text"
                name="question"
                class="form-control question-box"
                placeholder="Ask your question..."
                required
                autocomplete="off">

            <button
                type="submit"
                class="btn btn-primary mt-3 w-100">

                🤖 Ask AI

            </button>

        </form>


        <!-- AI ANSWER -->

        {% if answer %}

        <div class="mt-4">

            <h5>
                🤖 AI Answer
            </h5>

            <div class="answer-box shadow-sm">

                {{ answer | safe }}

            </div>

        </div>

        {% endif %}


        <!-- BACK BUTTON -->

        <div class="text-center mt-4">

            <a
                href="/dashboard"
                class="btn btn-secondary">

                ← Back to Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
