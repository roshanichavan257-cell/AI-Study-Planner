<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Study Planner - Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00c6fb);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{

    width:420px;
    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:0 15px 30px rgba(0,0,0,0.2);

    transition:.3s;

}

.login-card:hover{

    transform:translateY(-5px);

}

h2{

    text-align:center;

    color:#0d6efd;

    font-weight:bold;

    margin-bottom:10px;

}

p{

    text-align:center;

    color:gray;

    margin-bottom:30px;

}

.form-control{

    height:50px;

    border-radius:10px;

}

.form-control:focus{

    box-shadow:0 0 10px rgba(13,110,253,.4);

    border-color:#0d6efd;

}

.btn-login{

    width:100%;

    height:50px;

    border:none;

    border-radius:10px;

    background:#0d6efd;

    color:white;

    font-size:18px;

    font-weight:bold;

    transition:.3s;

}

.btn-login:hover{

    background:#084298;

    transform:scale(1.03);

}

.register{

    text-align:center;

    margin-top:20px;

}

.register a{

    text-decoration:none;

    font-weight:bold;

    color:#0d6efd;

}

.register a:hover{

    text-decoration:underline;

}

@media(max-width:500px){

.login-card{

width:90%;

padding:30px;

}

}

</style>

</head>

<body>

<div class="login-card">

<h2>🎓 AI Study Planner</h2>

<p>Welcome Back! Please Login</p>

<form action="/login" method="POST">

<input
type="email"
name="email"
class="form-control mb-3"
placeholder="Enter Email"
required>

<input
type="password"
name="password"
class="form-control mb-4"
placeholder="Enter Password"
required>

<button class="btn-login">

Login

</button>

</form>

<div class="register">

Don't have an account?

<br><br>

<a href="/register">

Create Account

</a>

</div>

</div>

</body>
</html>
