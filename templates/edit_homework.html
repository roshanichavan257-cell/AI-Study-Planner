<!DOCTYPE html>
<html>
<head>
    <title>Edit Homework</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h2>Edit Homework</h2>

<form method="POST">

<label>Subject</label>
<input type="text" name="subject" class="form-control" value="{{ hw.subject }}" required>

<label class="mt-3">Homework Title</label>
<input type="text" name="title" class="form-control" value="{{ hw.title }}" required>

<label class="mt-3">Description</label>
<textarea name="description" class="form-control">{{ hw.description }}</textarea>

<label class="mt-3">Due Date</label>
<input type="date" name="due_date" class="form-control" value="{{ hw.due_date }}" required>

<label class="mt-3">Priority</label>
<select name="priority" class="form-select">
    <option {% if hw.priority=="High" %}selected{% endif %}>High</option>
    <option {% if hw.priority=="Medium" %}selected{% endif %}>Medium</option>
    <option {% if hw.priority=="Low" %}selected{% endif %}>Low</option>
</select>

<label class="mt-3">Status</label>
<select name="status" class="form-select">
    <option {% if hw.status=="Pending" %}selected{% endif %}>Pending</option>
    <option {% if hw.status=="Completed" %}selected{% endif %}>Completed</option>
</select>

<br>

<button class="btn btn-success">Update Homework</button>

<a href="/homework" class="btn btn-secondary">Cancel</a>

</form>

</div>

</div>

</body>
</html>
