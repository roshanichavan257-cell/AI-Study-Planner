<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Quiz</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="card shadow p-4">

        <h2 class="text-center">
            🧠 {{ subject }} Quiz
        </h2>

        <p class="text-center text-muted">
            Topic: {{ topic }}
        </p>

        <hr>

        <form method="POST"
              action="{{ url_for('quiz_result') }}">

            {% for q in questions %}

            <div class="card mt-4 p-3">

                <h5>
                    Q{{ loop.index }}. {{ q.question }}
                </h5>

                <!-- OPTION A -->

                <div class="form-check mt-3">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="q{{ loop.index }}"
                        value="A"
                        required>

                    <label class="form-check-label">

                        A. {{ q.option_a }}

                    </label>

                </div>

                <!-- OPTION B -->

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="q{{ loop.index }}"
                        value="B">

                    <label class="form-check-label">

                        B. {{ q.option_b }}

                    </label>

                </div>

                <!-- OPTION C -->

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="q{{ loop.index }}"
                        value="C">

                    <label class="form-check-label">

                        C. {{ q.option_c }}

                    </label>

                </div>

                <!-- OPTION D -->

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="q{{ loop.index }}"
                        value="D">

                    <label class="form-check-label">

                        D. {{ q.option_d }}

                    </label>

                </div>

            </div>

            {% endfor %}

            <button
                type="submit"
                class="btn btn-success w-100 mt-4">

                ✅ Submit Quiz

            </button>

        </form>

    </div>

</div>

</body>

</html>
